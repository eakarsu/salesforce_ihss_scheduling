name: ci
on: [push, pull_request]
permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: scheduling_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d scheduling_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/scheduling_test
      JWT_SECRET: ci-only-random-replacement-secret-at-least-32-characters
      CORS_ORIGINS: http://127.0.0.1:4003
      APP_HOST: 127.0.0.1
      BACKEND_PORT: 4003
      NODE_ENV: test
      FIXTURE_PASSWORD: FixturePassword2026
      ALLOW_FIXTURE_SEED: YES
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
      - run: npm ci --prefix backend
      - run: npm ci --prefix frontend
      - run: npm run migrate --prefix backend
      - run: npm run fixtures --prefix backend
      - run: npm test --prefix backend
      - run: npm run migrate:check --prefix backend
      - run: npm run build --prefix frontend
      - run: npm audit --prefix backend --audit-level=low
      - run: npm audit --prefix frontend --audit-level=low
      - run: docker build -t installation-scheduling:verify .
      - uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
